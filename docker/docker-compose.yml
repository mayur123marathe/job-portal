  # ============================================================
  # SPRING CLOUD
  # ============================================================

  discovery:
    image: mayurmarathe/job-portal-service-registry:latest
    container_name: job-portal-discovery
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-net

  config-server:
    image: mayurmarathe/job-portal-config-server:latest
    container_name: job-portal-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8888:8888"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - job-portal-net

  gateway:
    image: mayurmarathe/job-portal-api-gateway:latest
    container_name: job-portal-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
      - "9000:5000"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Dspring.config.import=optional:configserver:http://config-server:8888 -Dspring.cloud.config.uri=http://config-server:8888 -Dspring.cloud.config.fail-fast=false"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_FAIL_FAST: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SERVER_PORT: 5000
    networks:
      - job-portal-net

  # ============================================================
  # APPLICATION SERVICES
