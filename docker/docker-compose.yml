

networks:
  job-portal-net:
    driver: bridge

volumes:
  userdb_data:
  companydb_data:
  jobdb_data:
  applicationdb_data:
#  paymentdb_data:
#  subscriptiondb_data:
  preferencedb_data:
  resumedb_data:

services:

  # ============================================================
  # DATABASES  (one container per service)
  # ============================================================

  userdb:
    image: postgres:16
    container_name: job-portal-userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_user
      POSTGRES_INITDB_ARGS: "--locale=C"
    volumes:
      - userdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net

  companydb:
    image: postgres:16
    container_name: job-portal-companydb
    mem_limit: 512m
