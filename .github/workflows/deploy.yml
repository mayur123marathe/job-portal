name: CI/CD - Build & Deploy Microservices

on:
  push:
    branches:
      - main
    paths:
      - 'job-portal-system/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Jib Images & Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push All Images
        run: |
          cd job-portal-system
          mvn clean install jib:build -DskipTests

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 60m

          script: |
            cd /opt/job-portal

            echo "🚀 Pulling latest images..."
            docker compose pull

            echo "🔄 Starting containers..."
            docker compose up -d

            echo "⏳ Polling Eureka service registry for readiness (up to 60 minutes)..."
            READY=false
            for i in {1..360}; do
              APPS_JSON=$(curl -s -H "Accept: application/json" http://localhost:8761/eureka/apps 2>/dev/null || true)
              REGISTERED_NAMES=$(echo "$APPS_JSON" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | sort -u | tr '\n' ' ' || true)
              COUNT=$(echo "$APPS_JSON" | grep -o '"status":"UP"' | wc -l || true)

              echo "Attempt $i/360: [$COUNT UP] -> Registered: $REGISTERED_NAMES"

              if [ "$COUNT" -ge 8 ]; then
                READY=true
                echo "✅ All core microservices are UP and registered in Eureka!"
                break
              fi
              sleep 10
            done

            if [ "$READY" = false ]; then
              echo "❌ FATAL: Microservices failed to become ready in Eureka within timeout!"
              echo ""
              echo "=== 📊 FINAL CONTAINER STATUSES ==="
              docker compose ps
              echo ""
              echo "=== 🔍 LOGS FOR CRASHING / RESTARTING SERVICES ==="
              for c in $(docker compose ps --services); do
                STATUS=$(docker inspect --format '{{.State.Status}}' "job-portal-$c" 2>/dev/null || echo "unknown")
                if [ "$STATUS" != "running" ]; then
                  echo "--- 🔴 Logs for $c (Status: $STATUS) ---"
                  docker compose logs --tail 25 "$c"
                  echo ""
                fi
              done
              exit 1
            fi

            echo "🔄 Refreshing Gateway cache..."
            docker compose restart gateway

            echo "✅ Deployment complete! Checking final container statuses:"
            docker compose ps
