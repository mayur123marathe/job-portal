name: CI/CD - Build & Deploy Microservices

on:
  push:
    branches:
      - main
    paths:
      - 'job-portal-system/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-push:
    name: Build Jib Images & Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Install Modules in Order
        run: |
          cd job-portal-system
          mvn clean install -DskipTests

      - name: Build & Push Docker Images via Google Jib
        run: |
          cd job-portal-system
          mvn compile jib:build -DskipTests

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS & Reload Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/job-portal
            echo "🚀 Pulling latest images from Docker Hub..."
            docker compose pull
            echo "🔄 Starting containers..."
            docker compose up -d
            echo "⏳ Waiting 45s for services to finish booting and register with Eureka..."
            sleep 45
            echo "🔄 Refreshing Gateway cache..."
            docker compose restart gateway
            echo "✅ Deployment complete! Checking container statuses:"
            docker compose ps
